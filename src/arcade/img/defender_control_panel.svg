<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Defender Control Panel</title>
  <desc id="desc">A simplified vector recreation of a retro arcade control panel.</desc>

  <!-- Basic reusable styling -->
  <defs>
    <style>
      .bg{fill:#000}
      .w{fill:none;stroke:#fefefe;stroke-width:5;stroke-linejoin:miter;stroke-linecap:square}
      .wt{fill:none;stroke:#fefefe;stroke-width:3.4;stroke-linejoin:miter;stroke-linecap:square}
      .wh{fill:none;stroke:#fefefe;stroke-width:1.6}
      .k{fill:#000}
      .wf{fill:#fefefe}
      .r{fill:#f9011f}
      .y{fill:#fdcc05}
      .g{fill:#02f202}
      .b{fill:#0058d8}
      .rl{fill:none;stroke:#f9011f;stroke-width:1.6}
      .rl2{fill:none;stroke:#f9011f;stroke-width:2.4}
      .label{fill:#fefefe;font-family:"Arial Narrow",Arial,sans-serif;font-weight:700}
      .dark{fill:#000}
    </style>
  </defs>

