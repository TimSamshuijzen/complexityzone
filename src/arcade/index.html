<head>

  <title>complexity.zone - Arcade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07060f;
      --cyan: #2ee6ff;
      --magenta: #ff2bd6;
      --yellow: #ffe14d;
      --orange: #ff5a2a;
      --green: #3dff8a;
      --home: #80cccc;
      --ink: #e8e6f5;
      --muted: #8d88a8;
      --pixel: "Press Start 2P", "Courier New", monospace;
      --neon: "Monoton", "Arial Black", Impact, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      position: relative;
    }
    a {
      color: inherit;
    }

    /* ---------- backdrop: night sky, horizon glow, grid floor ---------- */
    .sky,
    .floor,
    .horizon {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }
    .sky {
      inset: 0;
      background:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, #cfe, transparent),
        radial-gradient(1.5px 1.5px at 210px 20px, #fff, transparent),
        radial-gradient(1px 1px at 60px 150px, #fdf, transparent),
        radial-gradient(1px 1px at 170px 190px, #fff, transparent),
        radial-gradient(1px 1px at 250px 120px, #cff, transparent),
        radial-gradient(1.5px 1.5px at 90px 230px, #fff, transparent),
        radial-gradient(1px 1px at 280px 260px, #fff, transparent),
        linear-gradient(#05040c, #120b2a 55%, #2a0f4a);
      background-size:
        300px 300px, 300px 300px, 300px 300px, 300px 300px,
        300px 300px, 300px 300px, 300px 300px, 300px 300px,
        100% 100%;
    }
    .horizon {
      left: 0;
      right: 0;
      bottom: 42vh;
      height: 34vh;
      background: radial-gradient(ellipse at 50% 100%, #ff2bd640, #ff2bd612 40%, transparent 70%);
    }
    .horizon::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--magenta);
      box-shadow: 0 0 18px var(--magenta), 0 0 50px #ff2bd680;
    }
    .floor {
      left: -50%;
      right: -50%;
      bottom: 0;
      height: 42vh;
      transform-origin: 50% 0;
      transform: perspective(420px) rotateX(58deg);
      background:
        repeating-linear-gradient(90deg, #ff2bd6cc 0 2px, transparent 2px 90px),
        repeating-linear-gradient(0deg, #ff2bd6cc 0 2px, transparent 2px 70px);
      background-size: auto, 100% 70px;
      mask-image: linear-gradient(transparent, #000 45%);
      -webkit-mask-image: linear-gradient(transparent, #000 45%);
      animation: floor-scroll 2.4s linear infinite;
    }
    @keyframes floor-scroll {
      to {
        background-position: 0 0, 0 70px;
      }
    }

    /* ---------- top menu ---------- */
    .topbar {
      position: relative;
      z-index: 3;
      height: 40px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0a1acc;
      border-bottom: 1px solid #ffffff14;
      backdrop-filter: blur(6px);
    }
    .topbar .home {
      color: var(--home);
      font-size: 18px;
      line-height: 40px;
      text-decoration: none;
      white-space: nowrap;
      transition: text-shadow 0.25s;
    }
    .topbar .home:hover {
      text-shadow: 0 0 10px #80cccc99;
    }
    .topbar .crumb {
      color: var(--muted);
      font-size: 18px;
      margin-left: 12px;
    }

    /* ---------- hall ---------- */
    main {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 44px 16px 90px;
      text-align: center;
    }
    .sign .over {
      margin: 0;
      font: 11px/1 var(--pixel);
      letter-spacing: 5px;
      color: #80cccc;
      text-shadow: 0 0 6px #80cccc, 0 0 20px #80cccc80;
    }
    .sign h1 {
      margin: 14px 0 0;
      font: 400 clamp(44px, 12vw, 124px)/1 var(--neon);
      letter-spacing: 0.05em;
      color: #eafcff;
      text-shadow:
        0 0 4px #fff,
        0 0 12px var(--cyan),
        0 0 34px var(--cyan),
        0 0 70px #2ee6ff88;
      animation: flicker 7s infinite;
    }
    .sign .tag {
      margin: 24px 0 0;
      font: 10px/1.9 var(--pixel);
      letter-spacing: 2px;
      color: var(--muted);
    }
    @keyframes flicker {
      0%, 17%, 19%, 23%, 25%, 61%, 63%, 100% {
        opacity: 1;
      }
      18%, 24%, 62% {
        opacity: 0.5;
      }
      20% {
        opacity: 0.85;
      }
    }

    .hall {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 40px 70px;
      margin-top: 58px;
    }
    .machine {
      width: 320px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .machine.galaxian {
      --glow: #b7e83d;
      --glow-soft: #b7e83d55;
    }
    .machine.pacman {
      --glow: var(--yellow);
      --glow-soft: #ffe14d55;
    }
    .machine.defender {
      --glow: var(--orange);
      --glow-soft: #ff5a2a55;
    }
    .machine.starforce {
      --glow: var(--cyan);
      --glow-soft: #2ee6ff55;
    }

    /* ---------- cabinet ---------- */
    .cabinet {
      display: block;
      position: relative;
      width: 300px;
      padding: 10px 12px 14px;
      border-radius: 14px 14px 6px 6px;
      border: 1px solid #33333d;
      text-decoration: none;
      background: linear-gradient(90deg,
          #08080c, #2a2a33 2%, #15151b 5%,
          #131319 95%, #2c2c35 98%, #08080c);
      box-shadow:
        0 40px 60px -20px #000,
        0 0 40px -10px var(--glow),
        inset 0 0 0 4px #0a0a0e;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .cabinet::before,
    .cabinet::after {
      content: "";
      position: absolute;
      top: 96px;
      bottom: 78px;
      width: 3px;
      border-radius: 2px;
      background: var(--glow);
      box-shadow: 0 0 10px var(--glow), 0 0 26px var(--glow);
      opacity: 0.85;
    }
    .cabinet::before {
      left: 5px;
    }
    .cabinet::after {
      right: 5px;
    }
    .cabinet:hover,
    .cabinet:focus-visible {
      outline: none;
      transform: translateY(-8px);
      box-shadow:
        0 60px 70px -20px #000,
        0 0 80px -6px var(--glow),
        inset 0 0 0 4px #0a0a0e;
    }

    .marquee {
      position: relative;
      height: 92px;
      padding: 12px 16px;
      border: 3px solid #0a0a0e;
      border-radius: 10px 10px 3px 3px;
      background: radial-gradient(ellipse at 50% 30%, #1d1c2c, #0b0b12 75%);
      box-shadow: inset 0 0 26px var(--glow-soft), 0 0 20px -6px var(--glow);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .galaxian .marquee {
      padding: 6px 14px;
      background: #fffde9;
    }
    .marquee::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, transparent 40%, #ffffff0c 50%, transparent 60%);
      pointer-events: none;
    }
    .marquee .mark {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 14px var(--glow-soft));
    }

    .bezel {
      margin-top: 10px;
      height: 230px;
      border: 3px solid #0a0a0e;
      border-radius: 8px;
      background: #050507;
      box-shadow: inset 0 0 0 2px #1c1c24;
      display: grid;
      place-items: center;
      position: relative;
    }
    .screen {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #000;
      box-shadow: 0 0 26px -4px var(--glow);
    }
    .galaxian .screen {
      width: 154px;
      height: 176px;
    }
    .pacman .screen {
      width: 150px;
      height: 180px;
    }
    .defender .screen {
      width: 236px;
      height: 177px;
    }
    .starforce .screen {
      width: 154px;
      height: 176px;
    }
    .screen canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .glass {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, #00000055 2px 3px),
        radial-gradient(ellipse at 50% 35%, #ffffff12, transparent 60%);
    }
    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    .panel {
      margin-top: 10px;
      height: 64px;
      padding: 0 26px;
      border: 2px solid #0a0a0e;
      border-radius: 6px;
      background: linear-gradient(#2a2a34, #17171e);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stick {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle, #0a0a0e 34%, #2c2c36 36%, #101015 70%, #2c2c36 72%, #0a0a0e);
      display: grid;
      place-items: center;
    }
    .stick::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff7676, #b3161c 55%, #5a0a0d);
      box-shadow: 0 0 10px #ff3b3b88, 0 2px 3px #000;
      transform: translate(3px, -2px);
    }
    .btns {
      display: flex;
      gap: 9px;
    }
    .btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: inset 0 -4px 0 #0007, inset 0 2px 0 #fff5, 0 0 9px currentColor;
    }
    .btn.red {
      color: #ff3b3b;
    }
    .btn.white {
      color: #f4f2ff;
    }
    .btn.green {
      color: #3dff8a;
    }
    .btn.yellow {
      color: #ffe14d;
    }
    .btn.blue {
      color: #4da3ff;
    }

    .coin {
      margin-top: 10px;
      height: 78px;
      border: 2px solid #0a0a0e;
      border-radius: 6px;
      background: linear-gradient(#111116, #0b0b10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .slots {
      display: flex;
      gap: 28px;
    }
    .slot {
      width: 14px;
      height: 28px;
      border-radius: 3px;
      background: #1d1d26;
      box-shadow: inset 0 0 0 2px #2b2b36, inset 0 0 6px #000;
    }
    .slot::after {
      content: "";
      display: block;
      width: 3px;
      height: 14px;
      margin: 7px auto;
      background: #000;
    }
    .pool {
      width: 340px;
      height: 70px;
      margin-top: -28px;
      border-radius: 50%;
      background: radial-gradient(ellipse, var(--glow), transparent 60%);
      opacity: 0.28;
      filter: blur(12px);
      pointer-events: none;
    }

    /* ---------- plaque ---------- */
    .plaque {
      margin-top: 4px;
    }
    .plaque h2 {
      margin: 0;
      font: 14px/1.5 var(--pixel);
      color: #fff;
      text-shadow: 0 0 10px var(--glow);
    }
    .plaque .meta {
      margin: 8px 0 0;
      font: 9px/1.8 var(--pixel);
      letter-spacing: 1px;
      color: var(--muted);
    }
    .plaque p {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.55;
      color: #bcb8d2;
    }
    .play {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      font: 10px/1 var(--pixel);
      letter-spacing: 2px;
      color: var(--glow);
      border: 2px solid var(--glow);
      border-radius: 4px;
      text-decoration: none;
      text-shadow: 0 0 6px var(--glow);
      box-shadow: 0 0 14px -2px var(--glow), inset 0 0 14px -8px var(--glow);
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }
    .play:hover,
    .play:focus-visible {
      outline: none;
      background: var(--glow);
      color: #0a0a0e;
      text-shadow: none;
      box-shadow: 0 0 28px var(--glow);
    }

    @media (max-width: 760px) {
      .topbar .crumb {
        display: none;
      }
      .hall {
        gap: 54px;
      }
    }
    @media (max-width: 480px) {
      .sign .tag {
        font-size: 8px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .floor,
      .sign h1,
      .cabinet {
        transition: none;
      }
    }
  </style>
</head>

  <div class="horizon" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>

  <header class="topbar">
    <div>
      <a class="home" href="https://complexity.zone/">complexity.zone</a>
      <span class="crumb">/ arcade</span>
    </div>
  </header>

  <main>

          convoy.push({ x: GW / 2 - ROWS[i][0] * 6 + j * 12 + 2, y: 16 + i * 10, c1: ROWS[i][1], c2: ROWS[i][2], alive: true, home: true });
        }
      }

      function alien(x, y, c1, c2) {
        x |= 0;
        y |= 0;
        g.fillStyle = c1;
        g.fillRect(x + 2, y, 3, 3);
        g.fillRect(x, y + 1, 7, 1);
        g.fillStyle = c2;
        g.fillRect(x, y + 2, 1, 1);
        g.fillRect(x + 6, y + 2, 1, 1);
        g.fillRect(x + 3, y + 3, 1, 1);
      }

      function launchDiver() {
        var cands = [];
        for (i = 0; i < convoy.length; i++) {
          if (convoy[i].alive && convoy[i].home) cands.push(convoy[i]);
        }
        if (!cands.length) return;
        var a = cands[(Math.random() * cands.length) | 0];
        a.home = false;
        divers.push({ a: a, x: a.x + sway, y: a.y, t: 0, dir: Math.random() < 0.5 ? -1 : 1, f: 18 + Math.random() * 14 });
      }

      function drawGalaxian() {
        t3++;
        sway = Math.sin(t3 / 70) * 9;
        g.fillStyle = "#000";
        g.fillRect(0, 0, GW, GH);

        // scrolling, twinkling stars
        for (i = 0; i < gstars.length; i++) {
          var st = gstars[i];
          st.y += st.v;
          if (st.y > GH) { st.y = 0; st.x = Math.random() * GW; }
          if ((t3 + st.p) % 50 < 38) {
            g.fillStyle = st.c;
            g.fillRect(st.x | 0, st.y | 0, 1, 1);
          }
        }

        // convoy in formation
        var alive = 0;
        for (i = 0; i < convoy.length; i++) {
          var a = convoy[i];
          if (!a.alive) continue;
          alive++;
          if (a.home) alien(a.x + sway, a.y + ((t3 >> 4) & 1), a.c1, a.c2);
        }
        if (alive < 18 && !divers.length) {
          for (i = 0; i < convoy.length; i++) { convoy[i].alive = true; convoy[i].home = true; }
        }
        if (divers.length < 2 && Math.random() < 0.012) launchDiver();

        // divers swoop down and fire
        for (i = divers.length - 1; i >= 0; i--) {
          var dv = divers[i];
          dv.t++;
          dv.y += 0.9 + dv.t / 160;
          dv.x += dv.dir * 1.3 * Math.cos(dv.t / dv.f);
          if (dv.x < 1) { dv.x = 1; dv.dir = 1; }
          if (dv.x > GW - 8) { dv.x = GW - 8; dv.dir = -1; }
          if (dv.t % 34 === 17 && dv.y < GH - 60) ebul.push({ x: dv.x + 3, y: dv.y + 4 });
          if (dv.y > GH + 6) {
            dv.a.home = true;
            divers.splice(i, 1);
          } else {
            alien(dv.x, dv.y, dv.a.c1, dv.a.c2);
          }
        }
        g.fillStyle = "#fff";
        for (i = ebul.length - 1; i >= 0; i--) {
          var eb = ebul[i];
          eb.y += 2.2;
          if (eb.y > GH) ebul.splice(i, 1);
          else g.fillRect(eb.x | 0, eb.y | 0, 1, 3);
        }

        // Galaxip
        var px = (GW / 2 + Math.sin(t3 / 64) * 52) | 0, py = GH - 22;
        g.fillStyle = "#fff";
        g.fillRect(px, py - 5, 1, 6);
        g.fillRect(px - 2, py - 1, 5, 3);
        g.fillStyle = "#ff3b3b";
        g.fillRect(px - 5, py + 2, 11, 1);
        g.fillStyle = "#4d8dff";
        g.fillRect(px - 5, py + 3, 2, 1);
        g.fillRect(px + 4, py + 3, 2, 1);

        // one shot on screen at a time
        if (!gshot && Math.random() < 0.05) gshot = { x: px, y: py - 6 };
        if (gshot) {
          gshot.y -= 3.5;
          var hit = null;
          for (i = divers.length - 1; i >= 0 && !hit; i--) {
            if (gshot.x >= divers[i].x && gshot.x <= divers[i].x + 6 && gshot.y >= divers[i].y - 2 && gshot.y <= divers[i].y + 4) {
              hit = divers[i].a;
              divers.splice(i, 1);
            }
          }
          for (i = 0; i < convoy.length && !hit; i++) {
            var ca = convoy[i];
            if (ca.alive && ca.home && gshot.x >= ca.x + sway && gshot.x <= ca.x + sway + 6 && gshot.y >= ca.y - 2 && gshot.y <= ca.y + 4) hit = ca;
          }
          if (hit) {
            hit.alive = false;
            hit.home = true;
            bursts.push({ x: gshot.x, y: gshot.y, t: 0, c: hit.c1 });
            gshot = null;
          } else if (gshot.y < -6) {
            gshot = null;
          } else {
            g.fillStyle = "#fff";
            g.fillRect(gshot.x, gshot.y | 0, 1, 5);
          }
        }

        // explosions
        for (i = bursts.length - 1; i >= 0; i--) {
          var b = bursts[i];
          b.t++;
          if (b.t > 14) { bursts.splice(i, 1); continue; }
          var r = b.t / 2;
          g.fillStyle = b.t < 6 ? "#fff" : b.c;
          for (j = 0; j < 8; j++) {
            var ang = j * Math.PI / 4;
            g.fillRect((b.x + Math.cos(ang) * r) | 0, (b.y + Math.sin(ang) * r) | 0, 1, 1);
          }
        }
      }

      /* ---- Pac-Man attract mode: mini maze, dots, Pac-Man and four ghosts ---- */
      var pc = document.getElementById("pacman-screen");
      var p = pc.getContext("2d");
      var PW = pc.width, PH = pc.height;
      var T = 10, MY = 10;
      var MAZE = [
        "###############",
        "#.............#",
        "#.###.###.###.#",
        "#o...........o#",
        "#.#.#######.#.#",
        "#.#.........#.#",
        "#.##.##-##.##.#",
        "#.##.#GGG#.##.#",
        ".....#####.....",
        "#.##.#####.##.#",
        "#.............#",
        "#.###.#.#.###.#",
        "#o..#.....#..o#",
        "##.##.#.#.##.##",
        "#.............#",
        "###############"
      ];
      var MW = MAZE[0].length, MH = MAZE.length;
      var DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
      var CORNERS = [[13, 1], [1, 1], [13, 14], [1, 14]];
      var GCOL = ["#ff0000", "#ffb8ff", "#00ffff", "#ffb852"];
      var dots = [], dotsLeft = 0, pac, ghosts = [], pt = 0, dying = 0, win = 0, modeT = 0;

      function wrapX(x) {
        return ((x % MW) + MW) % MW;
      }
      function cell(x, y) {
        if (y < 0 || y >= MH) return "#";
        return MAZE[y].charAt(wrapX(x));
      }
      function isOpen(x, y) {
        var ch = cell(x, y);
        return ch === "." || ch === "o";
      }
      function resetDots() {
        dotsLeft = 0;
        for (var y = 0; y < MH; y++) {
          dots[y] = [];
          for (var x = 0; x < MW; x++) {
            var ch = MAZE[y].charAt(x);
            dots[y][x] = ch === "." ? 1 : ch === "o" ? 2 : 0;
            if (dots[y][x]) dotsLeft++;
          }
        }
      }
      function resetActors() {
        pac = { x: 7, y: 10, dx: -1, dy: 0, prog: 0, spd: 1 };
        ghosts = [];
        for (var i = 0; i < 4; i++) {
          ghosts.push({ x: 7, y: 5, dx: -1, dy: 0, prog: 0, spd: 0.85, fr: 0, pen: i ? 40 + i * 110 : -1, px: (5 + i) * T + 5, py: 7 * T + 5 });
        }
        dying = 0;
        modeT = 0;
      }
      function reverse(a) {
        a.x = wrapX(a.x + a.dx);
        a.y += a.dy;
        a.dx = -a.dx;
        a.dy = -a.dy;
        a.prog = 1 - a.prog;
      }
      function actorX(a) {
        return a.x * T + 5 + a.dx * a.prog * T;
      }
      function actorY(a) {
        return a.y * T + 5 + a.dy * a.prog * T + MY;
      }

      function choosePac() {
        var best = -1, bestS = -1e9, k, d, s, n, x, y, gi, g, found, tx = -1, ty = -1, td = 1e9;
        for (y = 0; y < MH; y++) {
          for (x = 0; x < MW; x++) {
            if (dots[y][x]) {
              n = Math.abs(x - pac.x) + Math.abs(y - pac.y);
              if (n < td) { td = n; tx = x; ty = y; }
            }
          }
        }
        for (k = 0; k < 4; k++) {
          d = DIRS[k];
          if (!isOpen(pac.x + d[0], pac.y + d[1])) continue;
          s = Math.random() * 3;
          if (d[0] === -pac.dx && d[1] === -pac.dy) s -= 5;
          if (tx >= 0) s -= (Math.abs(wrapX(pac.x + d[0]) - tx) + Math.abs(pac.y + d[1] - ty)) * 1.5;
          x = pac.x;
          y = pac.y;
          found = false;
          for (n = 1; n <= 6 && isOpen(x + d[0], y + d[1]); n++) {
            x = wrapX(x + d[0]);
            y += d[1];
            if (dots[y][x] && !found) { found = true; s += 9 - n; }
            for (gi = 0; gi < ghosts.length; gi++) {
              g = ghosts[gi];
              if (g.pen === -1 && g.x === x && g.y === y) s += g.fr ? 8 : -34 + n * 5;
            }
          }
          if (s > bestS) { bestS = s; best = k; }
        }
        if (best >= 0) { pac.dx = DIRS[best][0]; pac.dy = DIRS[best][1]; }
      }

      function chooseGhost(g, i) {
        var best = -1, bestS = 1e9, k, d, s, nx, ny, tx, ty;
        var scatter = modeT % 1200 < 300;
        if (scatter || i === 3 && Math.abs(g.x - pac.x) + Math.abs(g.y - pac.y) < 6) {
          tx = CORNERS[i][0];
          ty = CORNERS[i][1];
        } else if (i === 1) {
          tx = pac.x + pac.dx * 4;
          ty = pac.y + pac.dy * 4;
        } else if (i === 2) {
          tx = pac.x + ((Math.random() * 5) | 0) - 2;
          ty = pac.y + ((Math.random() * 5) | 0) - 2;
        } else {
          tx = pac.x;
          ty = pac.y;
        }
        for (k = 0; k < 4; k++) {
          d = DIRS[k];
          if (d[0] === -g.dx && d[1] === -g.dy) continue;
          if (!isOpen(g.x + d[0], g.y + d[1])) continue;
          nx = wrapX(g.x + d[0]);
          ny = g.y + d[1];
          if (g.fr) s = -(Math.abs(nx - pac.x) + Math.abs(ny - pac.y)) + Math.random() * 5;
          else s = Math.abs(nx - tx) + Math.abs(ny - ty) + Math.random() * 0.5;
          if (s < bestS) { bestS = s; best = k; }
        }
        if (best >= 0) {
          g.dx = DIRS[best][0];
          g.dy = DIRS[best][1];
        } else {
          g.dx = -g.dx;
          g.dy = -g.dy;
        }
      }

      function stepActor(a, ghostIndex) {
        a.prog += a.spd / T;
        while (a.prog >= 1) {
          a.prog -= 1;
          a.x = wrapX(a.x + a.dx);
          a.y += a.dy;
          if (ghostIndex < 0) choosePac(); else chooseGhost(a, ghostIndex);
        }
      }

      function drawMaze(col) {
        var x, y, ch;
        p.fillStyle = col;
        for (y = 0; y < MH; y++) {
          for (x = 0; x < MW; x++) {
            if (cell(x, y) !== "#") continue;
            p.fillRect(x * T + 2, y * T + 2 + MY, 6, 6);
            if (cell(x + 1, y) === "#" && x < MW - 1) p.fillRect(x * T + 8, y * T + 2 + MY, 4, 6);
            if (cell(x, y + 1) === "#") p.fillRect(x * T + 2, y * T + 8 + MY, 6, 4);
          }
        }
        p.fillStyle = "#000";
        for (y = 0; y < MH; y++) {
          for (x = 0; x < MW; x++) {
            if (cell(x, y) !== "#") continue;
            p.fillRect(x * T + 4, y * T + 4 + MY, 2, 2);
            if (cell(x + 1, y) === "#" && x < MW - 1) p.fillRect(x * T + 6, y * T + 4 + MY, 8, 2);
            if (cell(x, y + 1) === "#") p.fillRect(x * T + 4, y * T + 6 + MY, 2, 8);
          }
        }
        p.fillStyle = "#ffb8de";
        p.fillRect(7 * T - 2, 6 * T + 4 + MY, 14, 2);
        p.fillStyle = "#ffb8ae";
        for (y = 0; y < MH; y++) {
          for (x = 0; x < MW; x++) {
            ch = dots[y][x];
            if (ch === 1) {
              p.fillRect(x * T + 4, y * T + 4 + MY, 2, 2);
            } else if (ch === 2 && (pt >> 3) & 1) {
              p.beginPath();
              p.arc(x * T + 5, y * T + 5 + MY, 3.5, 0, Math.PI * 2);
              p.fill();
            }
          }
        }
      }

      function drawPac(cx, cy, r, ang, mouth) {
        p.fillStyle = "#ffe14d";
        p.beginPath();
        p.moveTo(cx, cy);
        p.arc(cx, cy, r, ang + mouth, ang + Math.PI * 2 - mouth);
        p.closePath();
        p.fill();
      }

      function drawGhost(g, i, cx, cy) {
        var blink = g.fr && g.fr < 90 && (pt >> 3) & 1;
        cx = Math.round(cx);
        cy = Math.round(cy);
        p.fillStyle = g.fr ? (blink ? "#f4f2ff" : "#2121de") : GCOL[i];
        p.beginPath();
        p.moveTo(cx - 5, cy + 5);
        p.lineTo(cx - 5, cy);
        p.arc(cx, cy, 5, Math.PI, 0);
        p.lineTo(cx + 5, cy + 5);
        if ((pt >> 3) & 1) {
          p.lineTo(cx + 3, cy + 3);
          p.lineTo(cx + 1, cy + 5);
          p.lineTo(cx - 1, cy + 3);
          p.lineTo(cx - 3, cy + 5);
        } else {
          p.lineTo(cx + 2, cy + 3);
          p.lineTo(cx, cy + 5);
          p.lineTo(cx - 2, cy + 3);
        }
        p.closePath();
        p.fill();
        if (g.fr) {
          p.fillStyle = blink ? "#ff0000" : "#ffb8de";
          p.fillRect(cx - 3, cy - 2, 2, 2);
          p.fillRect(cx + 1, cy - 2, 2, 2);
          p.fillRect(cx - 4, cy + 2, 8, 1);
        } else {
          p.fillStyle = "#fff";
          p.fillRect(cx - 4, cy - 3, 3, 3);
          p.fillRect(cx + 1, cy - 3, 3, 3);
          p.fillStyle = "#2121de";
          p.fillRect(cx - 3 + g.dx, cy - 2 + g.dy, 1, 1);
          p.fillRect(cx + 2 + g.dx, cy - 2 + g.dy, 1, 1);
        }
      }

      function drawLives() {
        drawPac(11, 175, 4, Math.PI, 0.6);
        drawPac(25, 175, 4, Math.PI, 0.6);
        p.fillStyle = "#ff2a2a";
        p.beginPath();
        p.arc(136, 176, 2.5, 0, Math.PI * 2);
        p.arc(141, 174, 2.5, 0, Math.PI * 2);
        p.fill();
        p.fillStyle = "#3dff8a";
        p.fillRect(140, 168, 1, 5);
        p.fillRect(136, 170, 5, 1);
      }

      resetDots();
      resetActors();

      function drawPacman() {
        var i, g, gx, gy, px, py, mouth, ang;
        pt++;
        p.fillStyle = "#000";
        p.fillRect(0, 0, PW, PH);

        px = actorX(pac);
        py = actorY(pac);
        ang = Math.atan2(pac.dy, pac.dx);

        // level cleared: flash the maze, then start over
        if (win > 0) {
          win--;
          drawMaze((win >> 4) & 1 ? "#f4f2ff" : "#2121de");
          drawPac(px, py, 5, ang, 0.05);
          drawLives();
          if (!win) { resetDots(); resetActors(); }
          return;
        }

        drawMaze("#2121de");
        drawLives();

        // caught by a ghost: Pac-Man folds away, then everyone resets
        if (dying > 0) {
          dying--;
          mouth = (1 - dying / 70) * Math.PI;
          drawPac(px, py, 5, -Math.PI / 2, Math.min(mouth, Math.PI));
          if (!dying) resetActors();
          return;
        }

        modeT++;
        stepActor(pac, -1);
        if (dots[pac.y][pac.x]) {
          if (dots[pac.y][pac.x] === 2) {
            for (i = 0; i < ghosts.length; i++) {
              if (ghosts[i].pen === -1) { ghosts[i].fr = 300; reverse(ghosts[i]); }
            }
          }
          dots[pac.y][pac.x] = 0;
          dotsLeft--;
          if (!dotsLeft) win = 100;
        }
        px = actorX(pac);
        py = actorY(pac);
        ang = Math.atan2(pac.dy, pac.dx);

        for (i = 0; i < ghosts.length; i++) {
          g = ghosts[i];
          if (g.pen > 0) {
            // waiting in the pen
            g.pen--;
            gx = g.px;
            gy = g.py + Math.sin(pt / 7 + i * 2) * 2 + MY;
            g.dy = Math.sin(pt / 7 + i * 2) > 0 ? 1 : -1;
            g.dx = 0;
          } else if (g.pen === 0) {
            // leaving the pen through the door
            if (Math.abs(g.px - (7 * T + 5)) > 0.5) g.px += g.px < 7 * T + 5 ? 0.5 : -0.5;
            else if (g.py > 5 * T + 5) g.py -= 0.5;
            else {
              g.pen = -1;
              g.x = 7;
              g.y = 5;
              g.prog = 0;
              g.dx = Math.random() < 0.5 ? -1 : 1;
              g.dy = 0;
            }
            gx = g.px;
            gy = g.py + MY;
            g.dx = 0;
            g.dy = -1;
          } else {
            g.spd = g.fr ? 0.5 : (g.y === 8 && (g.x < 5 || g.x > 9)) ? 0.45 : 0.85;
            stepActor(g, i);
            if (g.fr) g.fr--;
            gx = actorX(g);
            gy = actorY(g);
            if (Math.abs(gx - px) < 6 && Math.abs(gy - py) < 6) {
              if (g.fr) {
                // eaten: back to the pen
                g.fr = 0;
                g.pen = 150;
                g.px = 7 * T + 5;
                g.py = 7 * T + 5;
                gx = g.px;
                gy = g.py + MY;
              } else {
                dying = 70;
              }
            }
          }
          drawGhost(g, i, gx, gy);
        }

        mouth = Math.abs(Math.sin(pt / 5)) * 0.85;
        drawPac(px, py, 5, ang, mouth);
        if (px < 6) drawPac(px + MW * T, py, 5, ang, mouth);
        if (px > MW * T - 6) drawPac(px - MW * T, py, 5, ang, mouth);
      }

      /* ---- Defender attract mode: scrolling terrain, landers, ship ---- */
      var dc = document.getElementById("defender-screen");
      var d = dc.getContext("2d");
      var W = dc.width, H = dc.height;
      var stars = [], i;
      for (i = 0; i < 40; i++) {
        stars.push({ x: Math.random() * W, y: 26 + Math.random() * (H - 66), s: Math.random() < 0.3 ? 2 : 1, v: 0.15 + Math.random() * 0.45 });
      }
      var SEG = 4, N = 140, terrain = [], h = H - 40;
      for (i = 0; i < N; i++) {
        h += Math.round((Math.random() - 0.5) * 16);
        h = Math.max(H - 72, Math.min(H - 16, h));
        terrain.push(h);
      }
      var landers = [];
      for (i = 0; i < 3; i++) {
        landers.push({ x: 60 + Math.random() * W, y: 50 + Math.random() * 80, p: Math.random() * 6 });
      }
      var scroll = 0, t = 0, laser = 0;

      function drawDefender() {
        t++;
        d.fillStyle = "#000";
        d.fillRect(0, 0, W, H);

        // scanner strip
        d.fillStyle = "#4646ff";
        d.fillRect(58, 3, 120, 1);
        d.fillRect(58, 21, 120, 1);
        d.fillRect(58, 3, 1, 19);
        d.fillRect(177, 3, 1, 19);
        d.fillStyle = "#d0642a";
        for (i = 0; i < 118; i += 2) {
          var idx = Math.floor(scroll / SEG + i * N / 118) % N;
          d.fillRect(60 + i, 4 + Math.round((terrain[idx] - (H - 72)) / 56 * 15), 1, 1);
        }
        d.fillStyle = "#fff";
        d.fillRect(117, 12, 2, 1);

        // stars
        for (i = 0; i < stars.length; i++) {
          var s = stars[i];
          s.x -= s.v;
          if (s.x < 0) s.x += W;
          d.fillStyle = s.s === 2 ? "#fff" : "#9a9ab8";
          d.fillRect(s.x | 0, s.y | 0, s.s, s.s);
        }

        // terrain
        scroll = (scroll + 1.4) % (N * SEG);
        d.strokeStyle = "#d0642a";
        d.lineWidth = 1;
        d.beginPath();
        for (i = 0; i <= W / SEG + 1; i++) {
          var k = (Math.floor(scroll / SEG) + i) % N;
          var x = i * SEG - (scroll % SEG);
          if (i) d.lineTo(x, terrain[k]); else d.moveTo(x, terrain[k]);
        }
        d.stroke();

        // landers
        for (i = 0; i < landers.length; i++) {
          var l = landers[i];
          l.x -= 0.55;
          if (l.x < -10) { l.x = W + 10; l.y = 50 + Math.random() * 80; }
          var ly = l.y + Math.sin(t / 22 + l.p) * 4;
          d.fillStyle = "#3dff8a";
          d.fillRect(l.x | 0, ly | 0, 7, 3);
          d.fillRect((l.x + 2) | 0, (ly - 2) | 0, 3, 2);
          d.fillStyle = "#ffe14d";
          d.fillRect((l.x + 1) | 0, (ly + 3) | 0, 5, 1);
        }

        // ship
        var sx = 58, sy = (H / 2 + Math.sin(t / 34) * 20) | 0;
        d.fillStyle = "#ff4dd2";
        d.fillRect(sx - 5, sy + 1, 5, 1);
        d.fillStyle = "#fff";
        d.fillRect(sx, sy, 15, 3);
        d.fillRect(sx + 3, sy - 2, 8, 2);
        d.fillStyle = "#2ee6ff";
        d.fillRect(sx + 12, sy + 1, 4, 1);
        if (t % 4 < 2) {
          d.fillStyle = "#ffe14d";
          d.fillRect(sx - 9, sy + 1, 4, 1);
        }

        // laser
        if (laser > 0) {
          d.fillStyle = laser > 5 ? "#fff" : "#ff4dd2";
          d.fillRect(sx + 16, sy + 1, ((W - sx) * (1 - laser / 9)) | 0, 1);
          laser--;
        } else if (Math.random() < 0.02) {
          laser = 9;
        }
      }

      /* ---- Star Force attract mode: vertical starfield, fighter, shots ---- */
      var sc = document.getElementById("starforce-screen");
      var c = sc.getContext("2d");
      var SW = sc.width, SH = sc.height;
      var layers = [[0.5, "#3b3b5a", 32], [1.2, "#8f8fb8", 18], [2.4, "#ffffff", 9]];
      var field = [], j;
      for (i = 0; i < layers.length; i++) {
        for (j = 0; j < layers[i][2]; j++) {
          field.push({ x: Math.random() * SW, y: Math.random() * SH, v: layers[i][0], col: layers[i][1] });
        }
      }
      var foes = [], shots = [], t2 = 0;
      for (i = 0; i < 4; i++) {
        foes.push({ x: 24 + i * 36, y: -Math.random() * 220, p: i * 1.7 });
      }

      function drawStarForce() {
        t2++;
        c.fillStyle = "#000";
        c.fillRect(0, 0, SW, SH);

        for (i = 0; i < field.length; i++) {
          var p = field[i];
          p.y += p.v;
          if (p.y > SH) { p.y = 0; p.x = Math.random() * SW; }
          c.fillStyle = p.col;
          c.fillRect(p.x | 0, p.y | 0, 1, p.v > 2 ? 2 : 1);
        }

        for (i = 0; i < foes.length; i++) {
          var f = foes[i];
          f.y += 0.9;
          var fx = (f.x + Math.sin(t2 / 26 + f.p) * 22) | 0;
          if (f.y > SH + 12) f.y = -20 - Math.random() * 120;
          c.fillStyle = "#ff5a2a";
          c.fillRect(fx, f.y | 0, 9, 4);
          c.fillRect(fx + 3, (f.y - 2) | 0, 3, 2);
          c.fillStyle = "#ffe14d";
          c.fillRect(fx + 2, (f.y + 4) | 0, 5, 2);
        }

        var px = (SW / 2 + Math.sin(t2 / 44) * 44) | 0, py = SH - 48;
        c.fillStyle = "#fff";
        c.fillRect(px - 1, py - 8, 3, 14);
        c.fillStyle = "#2ee6ff";
        c.fillRect(px - 8, py, 17, 3);
        c.fillRect(px - 6, py + 3, 3, 3);
        c.fillRect(px + 4, py + 3, 3, 3);
        c.fillStyle = t2 % 4 < 2 ? "#ffe14d" : "#ff5a2a";
        c.fillRect(px - 1, py + 6, 3, 3);

        if (t2 % 12 === 0) {
          shots.push({ x: px - 4, y: py - 8 }, { x: px + 4, y: py - 8 });
        }
        c.fillStyle = "#ffe14d";
        for (i = shots.length - 1; i >= 0; i--) {
          var q = shots[i];
          q.y -= 4;
          if (q.y < -6) shots.splice(i, 1);
          else c.fillRect(q.x, q.y | 0, 1, 5);
        }
      }

      function loop() {
        drawGalaxian();
        drawPacman();
        drawDefender();
        drawStarForce();
        if (!reduce) window.requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
</html>
