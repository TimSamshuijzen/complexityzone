  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07060f;
      --cyan: #2ee6ff;
      --magenta: #ff2bd6;
      --yellow: #ffe14d;
      --orange: #ff5a2a;
      --green: #3dff8a;
      --home: #80cccc;
      --ink: #e8e6f5;
      --muted: #8d88a8;
      --pixel: "Press Start 2P", "Courier New", monospace;
      --neon: "Monoton", "Arial Black", Impact, sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      position: relative;
    }
    a {
      color: inherit;
    }

    /* ---------- backdrop: night sky, horizon glow, grid floor ---------- */
    .sky,
    .floor,
    .horizon {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }
    .sky {
      inset: 0;
      background:
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, #cfe, transparent),
        radial-gradient(1.5px 1.5px at 210px 20px, #fff, transparent),
        radial-gradient(1px 1px at 60px 150px, #fdf, transparent),
        radial-gradient(1px 1px at 170px 190px, #fff, transparent),
        radial-gradient(1px 1px at 250px 120px, #cff, transparent),
        radial-gradient(1.5px 1.5px at 90px 230px, #fff, transparent),
        radial-gradient(1px 1px at 280px 260px, #fff, transparent),
        linear-gradient(#05040c, #120b2a 55%, #2a0f4a);
      background-size:
        300px 300px, 300px 300px, 300px 300px, 300px 300px,
        300px 300px, 300px 300px, 300px 300px, 300px 300px,
        100% 100%;
    }
    .horizon {
      left: 0;
      right: 0;
      bottom: 42vh;
      height: 34vh;
      background: radial-gradient(ellipse at 50% 100%, #ff2bd640, #ff2bd612 40%, transparent 70%);
    }
    .horizon::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--magenta);
      box-shadow: 0 0 18px var(--magenta), 0 0 50px #ff2bd680;
    }
    .floor {
      left: -50%;
      right: -50%;
      bottom: 0;
      height: 42vh;
      transform-origin: 50% 0;
      transform: perspective(420px) rotateX(58deg);
      background:
        repeating-linear-gradient(90deg, #ff2bd6cc 0 2px, transparent 2px 90px),
        repeating-linear-gradient(0deg, #ff2bd6cc 0 2px, transparent 2px 70px);
      background-size: auto, 100% 70px;
      mask-image: linear-gradient(transparent, #000 45%);
      -webkit-mask-image: linear-gradient(transparent, #000 45%);
      animation: floor-scroll 2.4s linear infinite;
    }
    @keyframes floor-scroll {
      to {
        background-position: 0 0, 0 70px;
      }
    }

    /* ---------- top menu ---------- */
    .topbar {
      position: relative;
      z-index: 3;
      height: 40px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0a1acc;
      border-bottom: 1px solid #ffffff14;
      backdrop-filter: blur(6px);
    }
    .topbar .home {
      color: var(--home);
      font-size: 18px;
      line-height: 40px;
      text-decoration: none;
      white-space: nowrap;
      transition: text-shadow 0.25s;
    }
    .topbar .home:hover {
      text-shadow: 0 0 10px #80cccc99;
    }
    .topbar .crumb {
      color: var(--muted);
      font-size: 18px;
      margin-left: 12px;
    }

    /* ---------- hall ---------- */
    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 44px 16px 90px;
      text-align: center;
    }
    .sign .over {
      margin: 0;
      font: 11px/1 var(--pixel);
      letter-spacing: 5px;
      color: #80cccc;
      text-shadow: 0 0 6px #80cccc, 0 0 20px #80cccc80;
    }
    .sign h1 {
      margin: 14px 0 0;
      font: 400 clamp(44px, 12vw, 124px)/1 var(--neon);
      letter-spacing: 0.05em;
      color: #eafcff;
      text-shadow:
        0 0 4px #fff,
        0 0 12px var(--cyan),
        0 0 34px var(--cyan),
        0 0 70px #2ee6ff88;
      animation: flicker 7s infinite;
    }
    .sign .tag {
      margin: 24px 0 0;
      font: 10px/1.9 var(--pixel);
      letter-spacing: 2px;
      color: var(--muted);
    }
    @keyframes flicker {
      0%, 17%, 19%, 23%, 25%, 61%, 63%, 100% {
        opacity: 1;
      }
      18%, 24%, 62% {
        opacity: 0.5;
      }
      20% {
        opacity: 0.85;
      }
    }

    .hall {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 40px 70px;
      margin-top: 58px;
    }
    .machine {
      width: 320px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .machine.defender {
      --glow: var(--orange);
      --glow-soft: #ff5a2a55;
    }
    .machine.starforce {
      --glow: var(--cyan);
      --glow-soft: #2ee6ff55;
    }

    /* ---------- cabinet ---------- */
    .cabinet {
      display: block;
      position: relative;
      width: 300px;
      padding: 10px 12px 14px;
      border-radius: 14px 14px 6px 6px;
      border: 1px solid #33333d;
      text-decoration: none;
      background: linear-gradient(90deg,
          #08080c, #2a2a33 2%, #15151b 5%,
          #131319 95%, #2c2c35 98%, #08080c);
      box-shadow:
        0 40px 60px -20px #000,
        0 0 40px -10px var(--glow),
        inset 0 0 0 4px #0a0a0e;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .cabinet::before,
    .cabinet::after {
      content: "";
      position: absolute;
      top: 96px;
      bottom: 78px;
      width: 3px;
      border-radius: 2px;
      background: var(--glow);
      box-shadow: 0 0 10px var(--glow), 0 0 26px var(--glow);
      opacity: 0.85;
    }
    .cabinet::before {
      left: 5px;
    }
    .cabinet::after {
      right: 5px;
    }
    .cabinet:hover,
    .cabinet:focus-visible {
      outline: none;
      transform: translateY(-8px);
      box-shadow:
        0 60px 70px -20px #000,
        0 0 80px -6px var(--glow),
        inset 0 0 0 4px #0a0a0e;
    }

    .marquee {
      position: relative;
      height: 92px;
      padding: 12px 16px;
      border: 3px solid #0a0a0e;
      border-radius: 10px 10px 3px 3px;
      background: radial-gradient(ellipse at 50% 30%, #1d1c2c, #0b0b12 75%);
      box-shadow: inset 0 0 26px var(--glow-soft), 0 0 20px -6px var(--glow);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .marquee::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, transparent 40%, #ffffff0c 50%, transparent 60%);
      pointer-events: none;
    }
    .marquee .mark {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 14px var(--glow-soft));
    }

    .bezel {
      margin-top: 10px;
      height: 230px;
      border: 3px solid #0a0a0e;
      border-radius: 8px;
      background: #050507;
      box-shadow: inset 0 0 0 2px #1c1c24;
      display: grid;
      place-items: center;
      position: relative;
    }
    .screen {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #000;
      box-shadow: 0 0 26px -4px var(--glow);
    }
    .defender .screen {
      width: 236px;
      height: 177px;
    }
    .starforce .screen {
      width: 154px;
      height: 176px;
    }
    .screen canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .glass {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent 0 2px, #00000055 2px 3px),
        radial-gradient(ellipse at 50% 35%, #ffffff12, transparent 60%);
    }
    .attract {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      text-align: center;
      font: 8px/1 var(--pixel);
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 6px #fff;
      animation: blink 1.1s infinite;
    }
    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    .panel {
      margin-top: 10px;
      height: 64px;
      padding: 0 26px;
      border: 2px solid #0a0a0e;
      border-radius: 6px;
      background: linear-gradient(#2a2a34, #17171e);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stick {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle, #0a0a0e 34%, #2c2c36 36%, #101015 70%, #2c2c36 72%, #0a0a0e);
      display: grid;
      place-items: center;
    }
    .stick::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff7676, #b3161c 55%, #5a0a0d);
      box-shadow: 0 0 10px #ff3b3b88, 0 2px 3px #000;
      transform: translate(3px, -2px);
    }
    .btns {
      display: flex;
      gap: 9px;
    }
    .btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: inset 0 -4px 0 #0007, inset 0 2px 0 #fff5, 0 0 9px currentColor;
    }
    .btn.red {
      color: #ff3b3b;
    }
    .btn.white {
      color: #f4f2ff;
    }
    .btn.green {
      color: #3dff8a;
    }
    .btn.yellow {
      color: #ffe14d;
    }
    .btn.blue {
      color: #4da3ff;
    }

    .coin {
      margin-top: 10px;
      height: 78px;
      border: 2px solid #0a0a0e;
      border-radius: 6px;
      background: linear-gradient(#111116, #0b0b10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .slots {
      display: flex;
      gap: 28px;
    }
    .slot {
      width: 14px;
      height: 28px;
      border-radius: 3px;
      background: #1d1d26;
      box-shadow: inset 0 0 0 2px #2b2b36, inset 0 0 6px #000;
    }
    .slot::after {
      content: "";
      display: block;
      width: 3px;
      height: 14px;
      margin: 7px auto;
      background: #000;
    }
    .insert {
      font: 8px/1 var(--pixel);
      letter-spacing: 2px;
      color: var(--yellow);
      text-shadow: 0 0 7px var(--yellow);
      animation: blink 1.5s infinite;
    }

    .pool {
      width: 340px;
      height: 70px;
      margin-top: -28px;
      border-radius: 50%;
      background: radial-gradient(ellipse, var(--glow), transparent 60%);
      opacity: 0.28;
      filter: blur(12px);
      pointer-events: none;
    }

    /* ---------- plaque ---------- */
    .plaque {
      margin-top: 4px;
    }
    .plaque h2 {
      margin: 0;
      font: 14px/1.5 var(--pixel);
      color: #fff;
      text-shadow: 0 0 10px var(--glow);
    }
    .plaque .meta {
      margin: 8px 0 0;
      font: 9px/1.8 var(--pixel);
      letter-spacing: 1px;
      color: var(--muted);
    }
    .plaque p {
      margin: 12px 0 0;
      font-size: 14px;
      line-height: 1.55;
      color: #bcb8d2;
    }
    .play {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      font: 10px/1 var(--pixel);
      letter-spacing: 2px;
      color: var(--glow);
      border: 2px solid var(--glow);
      border-radius: 4px;
      text-decoration: none;
      text-shadow: 0 0 6px var(--glow);
      box-shadow: 0 0 14px -2px var(--glow), inset 0 0 14px -8px var(--glow);
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }
    .play:hover,
    .play:focus-visible {
      outline: none;
      background: var(--glow);
      color: #0a0a0e;
      text-shadow: none;
      box-shadow: 0 0 28px var(--glow);
    }

    @media (max-width: 760px) {
      .topbar .crumb {
        display: none;
      }
      .hall {
        gap: 54px;
      }
    }
    @media (max-width: 480px) {
      .sign .tag {
        font-size: 8px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .floor,
      .sign h1,
      .attract,
      .insert {
        animation: none;
      }
      .cabinet {
        transition: none;
      }
    }
  </style>
</head>

        landers.push({ x: 60 + Math.random() * W, y: 50 + Math.random() * 80, p: Math.random() * 6 });
      }
      var scroll = 0, t = 0, laser = 0;

      function drawDefender() {
        t++;
        d.fillStyle = "#000";
        d.fillRect(0, 0, W, H);

        // scanner strip
        d.fillStyle = "#4646ff";
        d.fillRect(58, 3, 120, 1);
        d.fillRect(58, 21, 120, 1);
        d.fillRect(58, 3, 1, 19);
        d.fillRect(177, 3, 1, 19);
        d.fillStyle = "#d0642a";
        for (i = 0; i < 118; i += 2) {
          var idx = Math.floor(scroll / SEG + i * N / 118) % N;
          d.fillRect(60 + i, 4 + Math.round((terrain[idx] - (H - 72)) / 56 * 15), 1, 1);
        }
        d.fillStyle = "#fff";
        d.fillRect(117, 12, 2, 1);

        // stars
        for (i = 0; i < stars.length; i++) {
          var s = stars[i];
          s.x -= s.v;
          if (s.x < 0) s.x += W;
          d.fillStyle = s.s === 2 ? "#fff" : "#9a9ab8";
          d.fillRect(s.x | 0, s.y | 0, s.s, s.s);
        }

        // terrain
        scroll = (scroll + 1.4) % (N * SEG);
        d.strokeStyle = "#d0642a";
        d.lineWidth = 1;
        d.beginPath();
        for (i = 0; i <= W / SEG + 1; i++) {
          var k = (Math.floor(scroll / SEG) + i) % N;
          var x = i * SEG - (scroll % SEG);
          if (i) d.lineTo(x, terrain[k]); else d.moveTo(x, terrain[k]);
        }
        d.stroke();

        // landers
        for (i = 0; i < landers.length; i++) {
          var l = landers[i];
          l.x -= 0.55;
          if (l.x < -10) { l.x = W + 10; l.y = 50 + Math.random() * 80; }
          var ly = l.y + Math.sin(t / 22 + l.p) * 4;
          d.fillStyle = "#3dff8a";
          d.fillRect(l.x | 0, ly | 0, 7, 3);
          d.fillRect((l.x + 2) | 0, (ly - 2) | 0, 3, 2);
          d.fillStyle = "#ffe14d";
          d.fillRect((l.x + 1) | 0, (ly + 3) | 0, 5, 1);
        }

        // ship
        var sx = 58, sy = (H / 2 + Math.sin(t / 34) * 20) | 0;
        d.fillStyle = "#ff4dd2";
        d.fillRect(sx - 5, sy + 1, 5, 1);
        d.fillStyle = "#fff";
        d.fillRect(sx, sy, 15, 3);
        d.fillRect(sx + 3, sy - 2, 8, 2);
        d.fillStyle = "#2ee6ff";
        d.fillRect(sx + 12, sy + 1, 4, 1);
        if (t % 4 < 2) {
          d.fillStyle = "#ffe14d";
          d.fillRect(sx - 9, sy + 1, 4, 1);
        }

        // laser
        if (laser > 0) {
          d.fillStyle = laser > 5 ? "#fff" : "#ff4dd2";
          d.fillRect(sx + 16, sy + 1, ((W - sx) * (1 - laser / 9)) | 0, 1);
          laser--;
        } else if (Math.random() < 0.02) {
          laser = 9;
        }
      }

      /* ---- Star Force attract mode: vertical starfield, fighter, shots ---- */
      var sc = document.getElementById("starforce-screen");
      var c = sc.getContext("2d");
      var SW = sc.width, SH = sc.height;
      var layers = [[0.5, "#3b3b5a", 32], [1.2, "#8f8fb8", 18], [2.4, "#ffffff", 9]];
      var field = [], j;
      for (i = 0; i < layers.length; i++) {
        for (j = 0; j < layers[i][2]; j++) {
          field.push({ x: Math.random() * SW, y: Math.random() * SH, v: layers[i][0], col: layers[i][1] });
        }
      }
      var foes = [], shots = [], t2 = 0;
      for (i = 0; i < 4; i++) {
        foes.push({ x: 24 + i * 36, y: -Math.random() * 220, p: i * 1.7 });
      }

      function drawStarForce() {
        t2++;
        c.fillStyle = "#000";
        c.fillRect(0, 0, SW, SH);

        for (i = 0; i < field.length; i++) {
          var p = field[i];
          p.y += p.v;
          if (p.y > SH) { p.y = 0; p.x = Math.random() * SW; }
          c.fillStyle = p.col;
          c.fillRect(p.x | 0, p.y | 0, 1, p.v > 2 ? 2 : 1);
        }

        for (i = 0; i < foes.length; i++) {
          var f = foes[i];
          f.y += 0.9;
          var fx = (f.x + Math.sin(t2 / 26 + f.p) * 22) | 0;
          if (f.y > SH + 12) f.y = -20 - Math.random() * 120;
          c.fillStyle = "#ff5a2a";
          c.fillRect(fx, f.y | 0, 9, 4);
          c.fillRect(fx + 3, (f.y - 2) | 0, 3, 2);
          c.fillStyle = "#ffe14d";
          c.fillRect(fx + 2, (f.y + 4) | 0, 5, 2);
        }

        var px = (SW / 2 + Math.sin(t2 / 44) * 44) | 0, py = SH - 48;
        c.fillStyle = "#fff";
        c.fillRect(px - 1, py - 8, 3, 14);
        c.fillStyle = "#2ee6ff";
        c.fillRect(px - 8, py, 17, 3);
        c.fillRect(px - 6, py + 3, 3, 3);
        c.fillRect(px + 4, py + 3, 3, 3);
        c.fillStyle = t2 % 4 < 2 ? "#ffe14d" : "#ff5a2a";
        c.fillRect(px - 1, py + 6, 3, 3);

        if (t2 % 12 === 0) {
          shots.push({ x: px - 4, y: py - 8 }, { x: px + 4, y: py - 8 });
        }
        c.fillStyle = "#ffe14d";
        for (i = shots.length - 1; i >= 0; i--) {
          var q = shots[i];
          q.y -= 4;
          if (q.y < -6) shots.splice(i, 1);
          else c.fillRect(q.x, q.y | 0, 1, 5);
        }
      }

      function loop() {
        drawDefender();
        drawStarForce();
        if (!reduce) window.requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
</html>
